<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Rocky Mountain Cafe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fdf3e5;
            color: #3b1f05;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .thank-you-box {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: #2d6a4f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .check-icon span {
            color: white;
            font-size: 2.5rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #3b1f05;
        }

        p {
            font-size: 1.1rem;
            color: #5c4033;
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .highlight {
            background: #fef3c7;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            font-weight: 600;
        }

        a {
            display: inline-block;
            margin-top: 1.5rem;
            color: #8b4513;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="thank-you-box">
        <div class="check-icon">
            <span>&#10003;</span>
        </div>
        <h1>Thank You for Your Order!</h1>
        <p>Your payment has been received and your order is being prepared.</p>
        <div class="highlight">We'll have your order ready for pickup soon. Please show your confirmation at the counter.</div>
        <p>Questions? Call us at <strong>(219) 570-1234</strong></p>
        <a href="https://cmtechtrading3369-crypto.github.io/rocky-mtn-cafe-website/">Back to Rocky Mountain Cafe</a>
    </div>
</body>
</html>
